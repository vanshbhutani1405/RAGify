services:
  - type: web
    name: ragify-backend
    runtime: python
    plan: starter
    branch: main
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port 10000"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: APP_NAME
        value: RAGify
      - key: APP_VERSION
        value: 1.0.0
      - key: API_PREFIX
        value: /api/v1
      - key: GROQ_API_KEY
        fromSecret: groq_api_key
      - key: LLM_MODEL
        value: llama3-8b-8192
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: LANGCHAIN_TRACING_V2
        value: false
      - key: LANGCHAIN_PROJECT
        value: RAGify
      - key: UPLOAD_DIR
        value: app/temp/uploads
      - key: PROCESSED_DIR
        value: app/temp/processed
      - key: CHUNK_SIZE
        value: 1500
      - key: CHUNK_OVERLAP
        value: 100
      - key: TOP_K
        value: 4
