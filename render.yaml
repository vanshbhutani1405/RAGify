services:
  - type: web
    name: ragify-backend
    runtime: python
    repo: https://github.com/vanshbhutani1405/RAGify # Replace with your repo
    plan: starter
    branch: main
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port 10000"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10
      - key: GROQ_API_KEY
        fromSecret: groq_api_key
      # Add other env vars from .env.example here
